name: Regenerate lockfile (one-off)

on:
  workflow_dispatch:
  push:
    branches: [fix/lockfile-resend-deps]

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kien
          POSTGRES_PASSWORD: kien
          POSTGRES_DB: kiensports
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kien"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kien:kien@localhost:5432/kiensports?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef
      PAYMENT_PROVIDER: mock
      PAYMENT_WEBHOOK_SECRET: ci-webhook-secret
      CORS_ORIGIN: http://localhost:5173
      ADMIN_EMAIL: ci-admin@kiensports.com
      ADMIN_PASSWORD: ci-admin-password-123
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Regenerate package-lock.json from package.json (real npm, existing lock preserved)
        run: npm install --no-audit --no-fund

      - name: Show lockfile delta (must be additive only)
        run: |
          git --version
          git diff --stat -- package-lock.json
          # List package entries added/removed (added names must be the resend tree only)
          git diff -- package-lock.json | grep -E '^\+\s+"node_modules/' | sed 's/^+\s*//' || true

      - name: Verify npm ci from clean state (the exact Docker build step)
        run: |
          rm -rf node_modules
          npm ci --no-audit --no-fund

      - name: Prisma generate
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Push schema to CI database
        run: npx prisma db push

      - name: Seed real catalog
        run: npx tsx prisma/seed.ts

      - name: Run tests (unit + API integration)
        run: npm test

      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit"
          else
            git commit -m "chore: regenerate package-lock.json with resend dependency tree (npm install, npm 10)"
            git push origin HEAD:fix/lockfile-resend-deps
          fi
